name: Feature request
description: Propose a power, a world rule, a tribe behaviour or an interface change
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do in the game, and what stops you today?
      placeholder: I want to see where a tribe is heading when it migrates.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the game could solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried or other designs you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - World generation
        - Simulation
        - Powers
        - Rendering
        - Interface
