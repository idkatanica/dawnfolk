# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json

name: Feature request
description: An idea for a power, a tribe behaviour or the interface
labels: [enhancement]

body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you'd like to see in the game.
      placeholder: Show where a tribe is heading when it migrates.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do, or what bothers you today.
